services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_BROKER_INTERNAL:-kafka:29092},PLAINTEXT_HOST://${KAFKA_BROKER_EXTERNAL:-localhost:9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-12}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "
      until kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do sleep 2; done;
      for topic in orders.commands orders.trades orders.book orders.dlq; do
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic $$topic --partitions ${KAFKA_TOPIC_PARTITIONS:-12} --replication-factor 1;
      done
      "

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matching_engine}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-matching_engine}"]
      interval: 5s
      timeout: 5s
      retries: 12

  broker-api:
    build: .
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - .env
    command: ["./build/broker_api_app"]
    ports:
      - "${BROKER_API_PORT:-8080}:${BROKER_API_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${BROKER_API_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  matcher:
    build: .
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - .env
    command: ["./build/kafka_matching_app"]
    volumes:
      - matcher-state:/state

  trade-db-consumer:
    build: .
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file:
      - .env
    command: ["./build/trade_db_consumer_app"]

volumes:
  postgres-data:
  matcher-state:
